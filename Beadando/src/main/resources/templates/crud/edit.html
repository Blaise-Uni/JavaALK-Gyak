<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Driver</title>
</head>
<body>
<h1>Edit current driver</h1>
<br/>
<form action="#" th:action="@{/crud/edit}"th:object="${driver}" method="post">
    <p><input type="hidden"th:field="*{id}"></p>
    <p><input type="text" th:field="*{name}"placeholder="Name required"/> </p>
    <p><input type="text" th:field="*{gender}"placeholder="Gender required"/> </p>
    <p><input type="text" th:field="*{dateOfBirth}"placeholder="Date of birth required"/> </p>
    <p><input type=date th:field="*{nationality}"placeholder="Nationaility required"/> </p>
    <p><input type="submit" value="Update" /></p>
</form>
</body>
</html>
