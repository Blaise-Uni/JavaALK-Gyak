<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Messages</title>
</head>
<body>
<div th:replace="~{menu :: menu}"></div>
<hr />
<h1>Messages</h1>
<table>
    <thead>
    <tr>
        <th>Subject</th>
        <th>Content</th>
        <th>Date</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="msg : ${messages}">
        <td th:text="${msg.subject != null ? msg.subject : '<no subject>'}"></td>
        <td th:text="${msg.content}">
        <td th:text="${#temporals.format(msg.dateTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
    </tbody>
</table>
</body>
</html>
